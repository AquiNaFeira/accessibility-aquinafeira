<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aqui na Feira - Tradução em Libras</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 10px; line-height: 1.4; color: #1b1b1b; background: #fff; }
    #conteudo { font-size: 1rem; white-space: pre-wrap; font-weight: bold; padding: 8px; background: #f4f4f4; border-radius: 8px; max-height: 5em; overflow: auto; }
    #erro { display: none; margin-top: 12px; padding: 10px; border: 1px solid #b00020; border-radius: 8px; color: #b00020; }
  </style>
</head>
<body>
  <p id="conteudo"></p>
  <p id="erro" role="alert">Não foi possível carregar o VLibras.</p>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    (function () {
      function notify(type, detail) {
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: type, detail: detail }));
        }
      }
      window.addEventListener('error', function (e) { notify('error', e.message); });

      var el = document.getElementById('conteudo');
      var params = new URLSearchParams(location.hash.slice(1));
      el.textContent = (params.get('t') || '').slice(0, 2000) || 'Ative "Selecionar" e toque em um texto do app.';

      // O app chama esta função para traduzir um texto
      window.vlibrasTranslate = function (texto) {
        el.textContent = String(texto || '').slice(0, 1500);
        el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
      };

      if (window.VLibras) {
        new window.VLibras.Widget('https://vlibras.gov.br/app');
        window.addEventListener('load', function () {
          setTimeout(function () {
            var b = document.querySelector('[vw-access-button]');
            if (b) b.click();
            notify('ready');
          }, 2500);
        });
      } else {
        document.getElementById('erro').style.display = 'block';
        notify('script-missing', 'VLibras não carregou');
      }
    })();
  </script>
</body>
</html>
